<!-- P3 首屏 Loading：先于一切脚本绘制（淡黄全屏遮罩 + 蓝色对冲加载条）。
     boot 首次渲染完成即淡出并移除；6 秒仍未就绪则追加重试按钮。
     注意：这里只放不依赖 ZQ 的最小内联逻辑，脚本加载失败时超时兜底仍然生效。 -->
<div class="boot-loading" id="boot-loading" role="status" aria-live="polite" aria-busy="true">
  <div class="boot-loader">
    <div class="boot-track">
      <div class="boot-fill">
        <svg class="boot-cart" viewBox="0 0 72 50" aria-hidden="true">
          <path d="M14 22 L22 9 H50 L59 22 Z" fill="currentColor" opacity=".85"/>
          <rect x="4" y="21" width="64" height="19" rx="9.5" fill="currentColor"/>
          <rect x="28" y="12" width="16" height="7" rx="3" fill="#FFF8DC" opacity=".9"/>
          <circle cx="20" cy="40" r="7.5" fill="#FFF8DC" stroke="currentColor" stroke-width="3"/>
          <circle cx="52" cy="40" r="7.5" fill="#FFF8DC" stroke="currentColor" stroke-width="3"/>
          <circle cx="66" cy="29" r="3" fill="#FFF8DC" opacity=".9"/>
        </svg>
      </div>
    </div>
    <div class="boot-loading-text">
      <span class="boot-ghost" aria-hidden="true">loading ...</span>
      <span class="boot-word"><span>loading ...</span></span>
    </div>
  </div>
  <div class="boot-timeout">
    <div class="boot-timeout-text">加载时间有点久，请检查网络后重试</div>
    <button class="boot-retry" type="button">重新加载</button>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById('boot-loading');
  if (!box) return;
  var timer = setTimeout(function () {
    if (window.__zqBooted) return;
    box.classList.add('is-timeout');
  }, 6000);
  box.querySelector('.boot-retry').addEventListener('click', function () {
    location.reload();
  });
  /* 双色交替：每轮动画从 0% 重启时触发，奇偶轮互换「已走过 / 未走过」的深浅蓝 */
  var fillEl = box.querySelector('.boot-fill');
  if (fillEl) {
    fillEl.addEventListener('animationiteration', function () {
      box.classList.toggle('is-round-even');
    });
  }
  /* main.js 的 boot 末尾调用：淡出 240ms 后从 DOM 移除，避免残留遮罩挡住交互 */
  window.__zqBootDone = function () {
    if (window.__zqBooted) return;
    window.__zqBooted = true;
    clearTimeout(timer);
    box.classList.add('is-done');
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 260);
  };
})();
</script>

// 仅在 ?debug=1 时加载出题自检脚本，避免正常运行时的额外开销
(function () {
  if (/[?&]debug=1\b/.test(location.search)) {
    var regression = document.createElement('script');
    regression.src = 'js/dev/regression.js?v=20261030-65';
    regression.onload = function () {
      ZQ.regression.report();
      var selfcheck = document.createElement('script');
      selfcheck.src = 'js/dev/selfcheck.js?v=20261030-65';
      selfcheck.onload = function () { ZQ.selfcheck.report(30); };
      document.body.appendChild(selfcheck);
    };
    document.body.appendChild(regression);
  }
})();
</script>
<script>
/* 注册 Service Worker：仅在 http(s) 下注册；file:// 双击通道、以及不支持的环境直接跳过，
 * 不注册也不影响游戏本体，只有「添加到主屏幕 / 离线」能力依赖它。
 * 注册成功交给 js/ui/update.js 盯更新：发现新版本只在非游戏屏弹横幅，玩家点了才接管刷新。 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (ZQ.ui && ZQ.ui.update) ZQ.ui.update.watch(reg);
    })['catch'](function () { /* 静默失败，不影响游戏 */ });
  });
})();
</script>

<!-- 访问统计（GoatCounter）：async 加载，不阻塞渲染；脚本被墙/离线时静默失败，不影响游戏 -->
<script data-goatcounter="https://ooorange.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
