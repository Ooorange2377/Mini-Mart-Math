<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EAF6FB">
<!-- PWA：安卓（Chrome / 华为 / 小米等）添加到主屏幕后以独立窗口运行 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<!-- 老版本国产浏览器内核仍只认这条 meta（不写也不报错，写了才保证独立窗口） -->
<meta name="mobile-web-app-capable" content="yes">
<!-- 内联 favicon：避免 /favicon.ico 404，也不额外增加图片文件 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23FFD9A6' stroke='%231B3E6F' stroke-width='3'/%3E%3Ccircle cx='11' cy='14' r='2' fill='%231B3E6F'/%3E%3Ccircle cx='21' cy='14' r='2' fill='%231B3E6F'/%3E%3C/svg%3E">
<title>零钱大作战 · 便利店精算师</title>
<link rel="stylesheet" href="css/base.css?v=20261030-58">
<link rel="stylesheet" href="css/layout.css?v=20261030-58">
<link rel="stylesheet" href="css/components.css?v=20261030-58">
<link rel="stylesheet" href="css/screens.css?v=20261030-58">
<link rel="stylesheet" href="css/animations.css?v=20261030-58">
<link rel="stylesheet" href="css/mobile.css?v=20261030-58">
</head>
<body>

<!-- 页面路由挂载点：main.js 整体替换 #app 子树 -->
<div id="app"></div>

<!-- 叠加层 -->
<div id="toast-layer" aria-live="polite"></div>
<div id="modal-layer"></div>

<!-- 竖屏提示：仅在竖屏且设备带触摸屏时显示，文案由 main.js 按语言填充 -->
<div class="rotate-tip" role="dialog" aria-modal="true">
  <div class="rotate-tip-card">
    <span class="rotate-tip-icon" aria-hidden="true"></span>
    <div class="rotate-tip-title"></div>
    <div class="rotate-tip-text"></div>
    <button class="rotate-tip-btn" type="button"></button>
  </div>
</div>

<noscript>
  <div class="noscript-tip">本游戏需要开启浏览器脚本功能才能运行。</div>
</noscript>

<!-- 依赖顺序：data → core → game → ui → screens → main -->
<script src="js/data/items.js?v=20261030-58"></script>
<script src="js/data/image-sizes.js?v=20261030-58"></script>
<script src="js/data/levels.js?v=20261030-58"></script>

<script src="js/core/rng.js?v=20261030-58"></script>
<script src="js/core/money.js?v=20261030-58"></script>
<script src="js/core/timers.js?v=20261030-58"></script>
<script src="js/core/audio.js?v=20261030-58"></script>
<script src="js/core/store.js?v=20261030-58"></script>
<script src="js/game/rules.js?v=20261030-58"></script>
<script src="js/game/generator.js?v=20261030-58"></script>
<script src="js/game/session.js?v=20261030-58"></script>
<script src="js/game/preload.js?v=20261030-58"></script>
<script src="js/ui/gesture.js?v=20261030-58"></script>
<script src="js/ui/slots.js?v=20261030-58"></script>
<script src="js/ui/shelf.js?v=20261030-58"></script>
<script src="js/ui/toast.js?v=20261030-58"></script>
<script src="js/ui/cart.js?v=20261030-58"></script>
<script src="js/ui/list.js?v=20261030-58"></script>
<script src="js/screens/result.js?v=20261030-58"></script>

<script src="js/screens/game.js?v=20261030-58"></script>
<script src="js/main.js?v=20261030-58"></script>
<script>
// 仅在 ?debug=1 时加载出题自检脚本，避免正常运行时的额外开销
(function () {
  if (/[?&]debug=1\b/.test(location.search)) {
    var regression = document.createElement('script');
    regression.src = 'js/dev/regression.js?v=20261030-58';
    regression.onload = function () {
      ZQ.regression.report();
      var selfcheck = document.createElement('script');
      selfcheck.src = 'js/dev/selfcheck.js?v=20261030-58';
      selfcheck.onload = function () { ZQ.selfcheck.report(30); };
      document.body.appendChild(selfcheck);
    };
    document.body.appendChild(regression);
  }
})();
</script>
<script>
/* 注册 Service Worker：仅在 http(s) 下注册；file:// 双击通道、以及不支持的环境直接跳过，
 * 不注册也不影响游戏本体，只有「添加到主屏幕 / 离线」能力依赖它。 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')['catch'](function () { /* 静默失败，不影响游戏 */ });
  });
})();
</script>

<!-- 访问统计（GoatCounter）：async 加载，不阻塞渲染；脚本被墙/离线时静默失败，不影响游戏 -->
<script data-goatcounter="https://ooorange.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>

</body>
</html>
